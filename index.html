<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>SRM Study Buddy | CINTEL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <!-- Logo with glasses icon -->
                <div class="logo-icon">
                    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <!-- Glasses frame -->
                        <circle cx="13" cy="20" r="8" stroke="white" stroke-width="2.5" fill="none" />
                        <circle cx="27" cy="20" r="8" stroke="white" stroke-width="2.5" fill="none" />
                        <!-- Bridge -->
                        <path d="M21 20 H19" stroke="white" stroke-width="2.5" stroke-linecap="round" />
                        <!-- Eyes -->
                        <circle cx="13" cy="20" r="3" fill="white" />
                        <circle cx="27" cy="20" r="3" fill="white" />
                    </svg>
                </div>
                <div class="logo-text">
                    <h1>SRM Study Buddy</h1>
                    <p class="logo-status" id="headerStatus">Ready to help</p>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" onclick="startNewChat()" title="New conversation">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
                        <path d="M21 3v5h-5" />
                        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
                        <path d="M3 21v-5h5" />
                    </svg>
                </button>
                <button class="icon-btn" title="Settings">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <circle cx="12" cy="12" r="3" />
                        <path
                            d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- Chat Container -->
        <main class="chat-container">
            <div class="messages" id="messages">
                <!-- Welcome Message -->
                <div class="message bot-message">
                    <div class="message-header">
                        <div class="message-avatar">
                            <svg viewBox="0 0 40 40" fill="none">
                                <circle cx="13" cy="20" r="6" stroke="white" stroke-width="2" fill="none" />
                                <circle cx="27" cy="20" r="6" stroke="white" stroke-width="2" fill="none" />
                                <path d="M21 20 H19" stroke="white" stroke-width="2" stroke-linecap="round" />
                                <circle cx="13" cy="20" r="2" fill="white" />
                                <circle cx="27" cy="20" r="2" fill="white" />
                            </svg>
                        </div>
                        <span class="bot-name">Study Buddy</span>
                    </div>
                    <div class="message-content">
                        <p>👋 <strong>Hey there!</strong> I'm your SRM Study Buddy.</p>
                        <p>I can help you find syllabi, exam topics, and course details. Just tell me which
                            <strong>subject</strong> you're studying!</p>
                        <div class="suggestions">
                            <button class="suggestion-btn" onclick="askQuestion('Machine Learning syllabus')">Machine
                                Learning</button>
                            <button class="suggestion-btn" onclick="askQuestion('Deep Learning syllabus')">Deep
                                Learning</button>
                            <button class="suggestion-btn" onclick="askQuestion('List all subjects')">All
                                Subjects</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Input Area -->
        <div class="input-area">
            <div class="input-container">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8" />
                    <path d="M21 21l-4.35-4.35" />
                </svg>
                <input type="text" id="userInput" placeholder="Ask Study Buddy anything..." autocomplete="off"
                    onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()" id="sendBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M12 19V5M5 12l7-7 7 7" />
                    </svg>
                </button>
            </div>
            <p class="powered-by">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M12 16v-4M12 8h.01" />
                </svg>
                AI responses generated from SRM CINTEL syllabus data
            </p>
        </div>
    </div>

    <script src="syllabus.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="llm.js"></script>
    <script src="app.js"></script>
</body>

</html>
